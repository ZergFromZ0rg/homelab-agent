# Reference deployment for one node. Copy this file and a .env beside it
# (see .env.example), then `docker compose up -d --build`.
#
# Why a compose file rather than the `docker run` lines in the README: a
# long run command has to be retyped correctly every time the container is
# recreated, and a flag dropped on a recreate fails quietly — a missing
# `--gpus all` turns full GPU telemetry into a bare "NVIDIA GPU 10DE:xxxx"
# with no util, VRAM or temperature, and nothing says why.

services:
  homelab-agent:
    build: .
    image: homelab-agent
    container_name: homelab-agent
    restart: unless-stopped

    ports:
      # On a plain LAN, bind to the tailnet address instead of every
      # interface: "100.x.y.z:8123:8123". See Security in the README.
      - "${AGENT_BIND:-0.0.0.0}:8123:8123"

    environment:
      # Must match the Prometheus job_name for this host, or the dashboard
      # can't line the agent's containers up with the host's metrics.
      HOST_NAME: ${HOST_NAME:?set HOST_NAME in .env}

      # Gates every mutating route, and GET /connections. Same value as the
      # dashboard's AGENT_TOKEN.
      AGENT_TOKEN: ${AGENT_TOKEN:-}

      # Registration — the agent tells the dashboard it exists.
      # REGISTER_TOKEN must match the dashboard's API_TOKEN.
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      AGENT_URL: ${AGENT_URL:-}
      REGISTER_TOKEN: ${REGISTER_TOKEN:-}

      # Configuration backup.
      BACKUP_REPO: ${BACKUP_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-12}
      STACK_DIRS: ${STACK_DIRS:-}

      # Deploy policy. Empty ALLOWED_HOST_PATHS means named volumes only,
      # which is the safe default — widen it deliberately.
      ALLOWED_REGISTRIES: ${ALLOWED_REGISTRIES:-}
      ALLOWED_HOST_PATHS: ${ALLOWED_HOST_PATHS:-}
      ALLOWED_DEVICES: ${ALLOWED_DEVICES:-}

      # Volume backups. Directories inside this container that archives
      # may be written to — see the volumes section. Empty means this host
      # stores no backups; it can still be a source for another node's.
      BACKUP_DIRS: ${BACKUP_DIRS:-}
      BACKUP_PUBLIC_URL: ${BACKUP_PUBLIC_URL:-}

      # Host directories this agent may back up, on top of named volumes.
      # Read through the /host mount below, so nothing extra is needed.
      BACKUP_SOURCE_DIRS: ${BACKUP_SOURCE_DIRS:-}

      # Rebuild-from-the-dashboard. Off unless set to 1, because it runs
      # `git pull` and `docker compose --build` — whatever the repo says,
      # as root on the host. See Rebuilding in the README.
      REBUILD_ENABLED: ${REBUILD_ENABLED:-}

      # Harmless on a host with no NVIDIA card; they only do anything when
      # the runtime below is nvidia.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    # Lets the agent see which process owns a socket, for the Connections
    # panel's host traffic (sshd, tailscaled, ...). Without it that part
    # is silently blank: reading another process's open files needs
    # ptrace-level access and Docker drops this by default. Container
    # traffic is named without it. Comment out if you'd rather not.
    cap_add:
      - SYS_PTRACE

    volumes:
      # The host daemon. This is the agent's real privilege boundary.
      - /var/run/docker.sock:/var/run/docker.sock

      # The host filesystem, read-only: the backup worker reads Compose
      # files from wherever they live, and GET /connections finds the
      # host's conntrack table underneath it with nothing else to mount.
      # Narrow it to your stack directory (plus STACK_DIRS) if you'd rather
      # — then add the single-file conntrack mount below.
      - /:/host:ro

      # Uncomment for the dashboard's Connections panel when you are NOT
      # using the whole-filesystem mount above. Left off by default because
      # a host without the nf_conntrack module loaded would fail to start
      # with it on.
      # - /proc/net/nf_conntrack:/host/nf_conntrack:ro

      # Backup working tree, so a restart doesn't re-clone the repo.
      - agent-data:/data

      # Where archives are written when this host stores backups. Set
      # BACKUP_HOST_DIR in .env to a directory on this machine and that is
      # the whole setup — the agent treats /backups as a destination only
      # when BACKUP_HOST_DIR is set.
      #
      # This is a variable rather than a line to uncomment because editing
      # a service's YAML by hand is the step people get wrong, and getting
      # it wrong is silent: the agent comes up fine and simply reports that
      # it stores nothing.
      #
      # The default is a throwaway named volume, so a host that stores no
      # backups has nothing of its filesystem bound in here. The mount is
      # still the boundary: the agent writes received archives itself, and
      # it can only ever write under this one path.
      - ${BACKUP_HOST_DIR:-agent-backups-unset}:/backups

    # NVIDIA hosts set AGENT_RUNTIME=nvidia in .env; everything else leaves
    # it alone. This is a variable rather than a line to uncomment because
    # losing it on a recreate is silent: the agent still PCI-detects the
    # card and still reports a GPU, just with no utilisation, VRAM,
    # temperature, fan or power — and nothing says why.
    runtime: ${AGENT_RUNTIME:-runc}

volumes:
  agent-data:
  # Bound at /backups only when BACKUP_HOST_DIR is unset. Nothing writes
  # here: without BACKUP_HOST_DIR the agent stores no backups at all.
  agent-backups-unset:
